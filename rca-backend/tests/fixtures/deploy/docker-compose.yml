version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      RCA_RUNTIME_MODE: ${RCA_RUNTIME_MODE:-mock_demo}
      RCA_PG_DSN: postgresql://rca:rca@postgres:5432/rca
      RCA_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
